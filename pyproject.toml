[project]
name = "atf-eval"
version = "0.1.0"
description = "Standalone evaluation framework for Agent Trajectory Fidelity (ATF): node traversal, state transition, tool invocation, routing, and outcome similarity scoring against a golden dataset"
readme = "README.md"
license = { text = "MIT" }
authors = [{ email = "janarddansarkar@gmail.com" }]
requires-python = ">=3.10"
keywords = ["agent", "evaluation", "llm", "eval", "trajectory", "golden-dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[project.scripts]
atf-eval = "atf_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atf_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
